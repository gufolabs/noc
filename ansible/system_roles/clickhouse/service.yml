---
- name: clickhouse tasks
  hosts: svc-clickhouse-exec
  become: true
  any_errors_fatal: "False"
  gather_facts: true
  tags:
    - clickhouse
    - external
  vars_files:
    - "../../vars/main.yml"
    - "../../vars/{{ ansible_distribution }}_{{ ansible_distribution_major_version }}.yml"
  roles:
    - role: clickhouse
    - role: goss
      tags: [goss]
      vars:
        goss_service_name: clickhouse
  post_tasks:
    - name: set clickhouse complete
      set_fact:
        clickhouse_complete: "True"
