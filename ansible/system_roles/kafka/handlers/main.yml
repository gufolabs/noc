---
- name: reload systemd
  become: true
  systemd:
    name: kafka
    daemon_reload: "True"

- name: restart kafka
  become: true
  service:
    name: "{{ kafka_system_service }}"
    state: restarted
    daemon_reload: "True"

- name: start kafka
  become: true
  service:
    name: "{{ kafka_system_service }}"
    state: started
