---
- name: reload systemd
  become: true
  systemd:
    name: "{{ mongod_system_service }}"
    daemon_reload: "True"

- name: restart mongod
  become: true
  service:
    name: "{{ mongod_system_service }}"
    state: restarted

- name: restart mongod-arbiter
  become: true
  service:
    name: "{{ mongod_arbiter_system_service }}"
    state: restarted
