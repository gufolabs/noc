#
# node role tasks
#
---
- name: "Include OS-specific tasks"
  include_tasks: "os/{{ ansible_distribution }}_{{ ansible_distribution_major_version }}/main.yml"
  tags:
    - requirements
    - repo

- name: Create NOC group
  group:
    name: "{{ noc_group }}"
    state: present

- name: Create NOC user
  user:
    name: "{{ noc_user }}"
    group: "{{ noc_group }}"
    comment: "NOC user"
    state: present

- name: Include Git install method
  include_tasks: git.yml
  when: install_method == "git"
  tags:
    - get_source

- name: Include venv init
  include_tasks: "init_venv.yml"
  tags:
    - requirements
    - config

- name: Restore Git .gitignore
  command:
    cmd: "git restore .gitignore"
    chdir: "{{ noc_root }}"
  when: install_method == "git"
  changed_when: false

- name: Create dirs
  import_tasks: "dirs.yml"

- name: Generate configs
  import_tasks: "config.yml"
  tags:
    - config
    - noc_config

- name: Include noc hacks
  import_tasks: "hacks.yml"
